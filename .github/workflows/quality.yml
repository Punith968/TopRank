name: Quality

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The tests only need the core ranking engine; torch / sentence-transformers
      # are used for the optional embedding and reranking stages.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0.0" "numpy>=1.24.0" pytest
      - name: Compile Python files
        run: python -m compileall -q toprank tests rank.py precompute.py validate_submission.py app.py
      - name: Run tests
        run: python -m pytest -q tests
      - name: Rank the sample dataset
        run: python rank.py --candidates data/sample_candidates.json --out sample_ranking.csv --no-rerank
